<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time ideal — COBBLEVERSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="topo" id="topo"></header>

  <main>
    <h1>Time ideal</h1>
    <p class="contagem">Escolha o Pokémon que você quer usar e o site monta os outros 5 em volta dele.</p>

    <section class="escolha">
      <div class="slot-favorito" id="favorito"></div>

      <label>
        <span>Quem pode entrar no time</span>
        <select id="dificuldade">
          <option value="natureza">Só quem nasce na natureza</option>
          <option value="faceis">Só comuns e incomuns (time fácil de montar)</option>
          <option value="todos">Qualquer Pokémon, inclusive lendário</option>
        </select>
      </label>
    </section>

    <section id="resultado"></section>
  </main>

  <dialog id="seletor">
    <div class="seletor-topo">
      <input type="search" id="busca-time" placeholder="Buscar por nome ou número..." autocomplete="off">
      <button type="button" id="fechar" class="botao-fraco">Fechar</button>
    </div>
    <p class="contagem" id="contagem-seletor"></p>
    <div class="resultados" id="resultados"></div>
  </dialog>

  <script src="js/menu.js"></script>
  <script src="js/comum.js"></script>
  <script src="dados/pokemon.js"></script>
  <script src="js/tipos.js"></script>
  <script src="js/seletor.js"></script>
  <script src="js/avaliar.js"></script>
  <script src="js/pagina-time-ideal.js"></script>
</body>
</html>
